name: Build Linux Package

on:
  push:
    branches: [ main, master, linux-cross-platform ]
  pull_request:
    branches: [ main, master, linux-cross-platform ]

jobs:
  build-ubuntu:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          bash scripts/install-linux-deps.sh

      - name: Install Node dependencies
        run: npm ci

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked || cargo install tauri-cli

      - name: Build Linux package
        run: bash scripts/build-linux.sh
        env:
          BUNDLES: "deb"

      - name: Extract Versions for Artifact
        run: |
          # Get the app version from package.json
          APP_VERSION=$(node -p "require('./package.json').version")

          # Get the exact Ubuntu version of the current runner (e.g., 22.04 or 24.04)
          UBUNTU_VERSION=$(lsb_release -rs)

          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          echo "UBUNTU_VERSION=$UBUNTU_VERSION" >> $GITHUB_ENV

      - name: Upload .deb Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spectrapdf-v${{ env.APP_VERSION }}-ubuntu-${{ env.UBUNTU_VERSION }}
          path: src-tauri/target/release/bundle/deb/*.deb
